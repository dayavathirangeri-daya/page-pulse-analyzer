openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Page Pulse URL analyzer
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: URL analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeUrl
      tags: [analyze]
      summary: Analyze a URL
      description: Fetches and analyzes a webpage, returning SEO and performance metrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Successfully analyzed the URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResult"
        "400":
          description: Invalid URL or bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
        "408":
          description: Request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
        "422":
          description: Non-HTML content returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to analyze (must be a valid http/https URL)
          example: "https://example.com"
      required:
        - url
    AnalyzeResult:
      type: object
      properties:
        status:
          type: integer
          description: HTTP status code of the target URL
          example: 200
        responseTime:
          type: string
          description: Time taken to fetch the page
          example: "320 ms"
        title:
          type: string
          description: The page title from the HTML title tag
          example: "Example Domain"
        metaDescription:
          type: string
          description: The meta description content
          example: "This is an example website"
        h1Count:
          type: integer
          description: Number of H1 tags on the page
          example: 1
        missingAltImages:
          type: integer
          description: Number of img tags missing alt attribute
          example: 3
        wordCount:
          type: integer
          description: Approximate word count of visible text
          example: 542
      required:
        - status
        - responseTime
        - title
        - metaDescription
        - h1Count
        - missingAltImages
        - wordCount
    AnalyzeError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Invalid URL provided"
        code:
          type: string
          description: Machine-readable error code
          example: "INVALID_URL"
      required:
        - error
        - code
